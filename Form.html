<html>
    <head>
<TITLE>FORM</TITLE>
    </head>

    <body>
          <div>
            <h1>Form in HTML</h1>
            <TABLE BORDER=1>
<FORM>
               <TR> <th>INFORMATION</TH><TH>INPUT</TH></TR>
                <TR><TD>USERNAME</TD>
                <TD><INPUT TYPE="TEXT" NAME="USERNAME" placeholder="ENTER USERNAME"></TD><INPUT></INPUT></TD></TR>
<TR><td>e-mail</td><td><input type="email" name="email" placeholder="abc@gmail.com"></input></td>
                    <TR><TD>PASSWORD</TD><TD><INPUT TYPE="PASSWORD" NAME="PASSWORD" PLACEHOLDER="ENTER PASSWORD"></INPUT></TD></TR>
<tr><td>phone number</td><td><input type="number" value="+977" placeholder="xxx-xxxxxxx"></input></td></tr>
                <TR><TD>Hobby</td>
<td><input type="checkbox" name="hobby" value="sports">sports</input>
<input type="checkbox" name="hobby2" value="singing">singing</input>
<input type="checkbox" name="hobby3" value="dancing">dancing</input>
<input type="checkbox" name="hobby4" value="reading">reading</input></tr>
<tr><td>gender</td>
<td><input type="radio" name="gender" value="male">male</input>
<input type="radio" name="gender" value="femlale">female</input>
<input type="radio" name="gender" value="others">other</input></td></tr>
<input type="submit"></input>
<input type="reset" ></input>
    <TR>
        <TD>COUNTRY</TD>
       <TD>
           <SELECT NAME="COUNTRY">
<OPTION>NEPAL</OPTION><OPTION>India</OPTION><OPTION>America</OPTION>
</select>
       </TD>
    </TR>
    </FORM>
            </TABLE>
        </div>
        
    </body>
</html>
